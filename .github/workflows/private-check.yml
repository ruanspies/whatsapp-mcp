name: Private data check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No private data in any tracked file
        run: scripts/check-private.sh all
      - name: No private data added by the pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: scripts/check-private.sh commits $(git rev-list ${{ github.event.before }}..${{ github.sha }})
